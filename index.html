<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      align-items: baseline;
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      user-select: none;
    }

    .dots {
      display: inline-block;
      width: 1.5ch;
      text-align: left;
    }

    .subtle-pulse {
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="container subtle-pulse">
    <span>Building</span><span id="dots" class="dots">.</span>
  </div>

  <script>
    const dotsElement = document.getElementById('dots');
    let count = 1;

    // Animiert die Punkte (. -> .. -> ... -> .)
    setInterval(() => {
      count = (count % 3) + 1;
      dotsElement.textContent = '.'.repeat(count);
    }, 500);
  </script>
</body>
</html>
